<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feedback Form</title>
<body style="background-color: paleturquoise;">
    <h1 style="text-align: center;">Feedback Form</h1>
    <center>
        <form style="border: 2px solid black; padding: 50px; border-radius: 10px; width: 300px;">
            
            <label for="name">Name</label>
            <input type="text" id="name" name="name"> <br><br>
      
            <label for="email">Email</label>
            <input type="email" id="email" name="email"> <br><br>
      
            <label for="fb">Feedback</label>
            <input type="textarea" id="fb" name="fb"> <br><br>
      
            <label for="rate">Rating</label> <br>
            <input type="radio" id="rate1" name="rate" value="1">
            <label for="rate1">1</label>
            <input type="radio" id="rate2" name="rate" value="2">
            <label for="rate2">2</label>
            <input type="radio" id="rate3" name="rate" value="3">
            <label for="rate3">3</label> <br>

            <input type="reset" value="Submit" style="margin-top: 20px; size: 50px;"> 
          </form>
</center>
</body>
</html>
